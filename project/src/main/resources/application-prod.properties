# =============================================================
# application-prod.properties -- FFilm Production Configuration
# Do NOT commit secrets. All sensitive values use env vars.
# =============================================================

spring.application.name=project

# --- Database: Azure SQL (SQL Server, 100% compatible) ---
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.open-in-view=false
spring.cache.type=simple
spring.thymeleaf.cache=true

# --- Logging ---
logging.level.org.springframework.web=WARN
logging.level.com.example.project=INFO
spring.main.banner-mode=off

# --- API Keys ---
gemini.api.key=${GEMINI_API_KEY}
tmdb.api.key=${TMDB_API_KEY:148c2d2c497b43450ec77686438576b8}
tenor.api.key=${TENOR_API_KEY:}
tenor.client.key=FFilm_Connect

app.default.video.url=/video/movie1.mp4

# --- App base URL ---
app.base.url=${APP_BASE_URL}
server.port=${PORT:8081}
server.forward-headers-strategy=framework

# --- Google OAuth2 (conditional) ---
google.client.id=${GOOGLE_CLIENT_ID:}
google.client.secret=${GOOGLE_CLIENT_SECRET:}

# --- Email: Resend API (HTTP, bypasses Render SMTP block) ---
email.provider=${EMAIL_PROVIDER:smtp}
resend.api.key=${RESEND_API_KEY:}
resend.from.email=${RESEND_FROM_EMAIL:noreply@ffilm.app}

# --- SMTP (still used in local dev, ignored in prod via email.provider) ---
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000

# --- VNPay (sandbox) ---
vnpay.vnp_TmnCode=${VNPAY_TMN_CODE:8NCYOTU5}
vnpay.vnp_HashSecret=${VNPAY_HASH_SECRET:FDTOUCRNVVWGNTWMBZSZNUUPENYYTHOO}
vnpay.vnp_PayUrl=https://sandbox.vnpayment.vn/paymentv2/vpcpay.html
