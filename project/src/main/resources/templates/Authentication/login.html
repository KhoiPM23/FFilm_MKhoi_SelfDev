<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <title>Đăng nhập - Phim Hay</title>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="/css/style.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        height: 100vh;
        background: linear-gradient(
            to top,
            rgba(0, 0, 0, 0.85),
            rgba(0, 0, 0, 0.45),
            rgba(0, 0, 0, 0.85)
          ),
          url("https://bloganchoi.com/wp-content/uploads/2021/09/5-series-phim-netflix-cuc-chat-1068x601.jpg")
            center/cover no-repeat;
        font-family: "Poppins", sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 20px;
      }

      .box {
        background: rgba(0, 0, 0, 0.78);
        padding: 60px 55px;
        border-radius: 10px;
        width: 380px;
        backdrop-filter: blur(4px);
        box-shadow: 0 0 45px rgba(0, 0, 0, 0.8);
        animation: fadeIn 0.9s ease;
      }

      h2 {
        text-align: center;
        color: #fff;
        font-size: 30px;
        margin-bottom: 30px;
        font-weight: 600;
        letter-spacing: 1px;
      }

      input {
        width: 100%;
        padding: 15px;
        margin: 14px 0;
        border: none;
        border-radius: 6px;
        background: #222;
        color: #fff;
        font-size: 15px;
        transition: 0.3s;
      }

      input:focus {
        background: #333;
        box-shadow: 0 0 8px #e50914;
      }

      button {
        width: 100%;
        padding: 15px;
        margin-top: 20px;
        border: none;
        border-radius: 6px;
        background: #e50914;
        color: #fff;
        cursor: pointer;
        font-size: 17px;
        font-weight: 600;
        transition: 0.3s;
      }

      button:hover {
        background: #f40612;
        transform: translateY(-2px);
      }

      .extra {
        text-align: center;
        margin-top: 25px;
        color: #bbb;
        font-size: 14px;
      }

      .extra a {
        color: #fff;
        text-decoration: none;
        font-weight: 500;
      }

      .extra a:hover {
        color: #e50914;
      }

      .error {
        color: #ff4d4d;
        text-align: center;
        margin-top: 15px;
      }
      .message {
        color: #00ff7f;
        text-align: center;
        margin-top: 15px;
      }

      .oauth-divider {
        display: flex;
        align-items: center;
        text-align: center;
        margin: 20px 0 16px;
        color: #888;
        font-size: 12px;
        font-weight: 500;
        letter-spacing: 0.8px;
      }
      .oauth-divider::before,
      .oauth-divider::after {
        content: '';
        flex: 1;
        border-bottom: 1px solid rgba(255, 255, 255, 0.16);
      }
      .oauth-divider span {
        padding: 0 10px;
      }
      .google-login-btn {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 12px;
        width: 100%;
        padding: 13px;
        border-radius: 6px;
        background: #ffffff;
        color: #1f1f1f;
        text-decoration: none;
        font-size: 15px;
        font-weight: 600;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
        transition: all 0.25s ease;
      }
      .google-login-btn:hover {
        background: #f1f3f4;
        box-shadow: 0 4px 14px rgba(255, 255, 255, 0.15);
        transform: translateY(-2px);
        color: #000;
      }
      .google-icon {
        flex-shrink: 0;
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(-20px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
    </style>
  </head>
  <body>
    <div class="box">
      <h2>ĐĂNG NHẬP</h2>
      <form th:action="@{/login}" th:object="${user}" method="post" autocomplete="off">
        <input type="hidden" name="redirect" th:value="${redirectUrl != null ? redirectUrl : (param.redirect != null ? param.redirect[0] : '')}" />
        <input type="email" th:field="*{email}" placeholder="Email" required autocomplete="off" />
        <input
          type="password"
          th:field="*{password}"
          placeholder="Mật khẩu"
          required
          autocomplete="off"
        />
        <button type="submit">Đăng nhập</button>
        <div class="extra">
          <br /><br />
          <a th:href="@{/auth/forgot-password}" style="color: #e50914"
            >Quên mật khẩu?</a
          >
        </div>
      </form>

      <div class="oauth-divider">
        <span>HOẶC</span>
      </div>

      <a th:href="@{/oauth2/authorization/google}" class="google-login-btn" id="googleLoginBtn">
        <svg viewBox="0 0 24 24" width="20" height="20" class="google-icon">
          <path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.66-5.17 3.66-9.17z"/>
          <path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.1-6.72-4.93H1.25v3.15C3.26 21.36 7.33 24 12 24z"/>
          <path fill="#FBBC05" d="M5.28 14.27c-.25-.72-.38-1.49-.38-2.27s.13-1.55.38-2.27V6.58H1.25C.45 8.16 0 9.97 0 12s.45 3.84 1.25 5.42l4.03-3.15z"/>
          <path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.33 0 3.26 2.64 1.25 6.58l4.03 3.15c.95-2.83 3.6-4.98 6.72-4.98z"/>
        </svg>
        <span>Tiếp tục với Google</span>
      </a>

      <p th:if="${param.logout}" class="message" style="color: #00ff7f; text-align: center; margin-top: 15px; font-weight: 500;">
        <i class="fas fa-check-circle"></i> Đã đăng xuất thành công.
      </p>
      <p th:if="${loginError}" class="error" th:text="${loginError}"></p>
      <p th:if="${param.error != null and param.error[0] == 'oauth2'}" class="error">
        Đăng nhập bằng Google không thành công hoặc bị hủy. Vui lòng thử lại.
      </p>
      <p th:if="${param.error != null and param.error[0] == 'locked'}" class="error">
        Tài khoản của bạn đã bị khóa. Vui lòng liên hệ quản trị viên.
      </p>
      <div class="extra">
        Chưa có tài khoản? <a th:href="@{/register}">Đăng ký ngay</a>
      </div>
    </div>

    <script>
      // Ngăn người dùng back lại thấy trang đăng nhập
      if (window.history && window.history.replaceState) {
        window.history.replaceState(null, null, window.location.href);
      }
      window.addEventListener("pageshow", function (event) {
        if (event.persisted) {
          window.location.reload();
        }
      });
    </script>
    <script src="/js/script.js" defer></script>
  </body>
</html>
