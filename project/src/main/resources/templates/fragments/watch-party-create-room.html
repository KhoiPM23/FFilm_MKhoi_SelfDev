<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="createRoomModal" id="createRoomModal" class="modal-overlay">
    <div class="modal-box">
        <h2 style="margin-bottom: 20px; text-align: center;">🎬 Tạo Phòng Chiếu</h2>
        <form action="/watch-party/create" method="post" id="createRoomForm" onsubmit="return handleCreateRoomSubmit(event)">
            <div class="form-group">
                <label>Tên Phòng</label>
                <input type="text" name="name" class="form-control" required placeholder="Ví dụ: Hội yêu phim kinh dị...">
            </div>
            <div class="form-group">
                <label>Số lượng thành viên</label>
                <select name="maxUsers" class="form-control">
                    <option value="10">10 Người (Nhóm nhỏ)</option>
                    <option value="25">25 Người (Lớp học)</option>
                    <option value="100">100 Người (Rạp chiếu)</option>
                </select>
            </div>
            <div class="form-group">
                <label>Loại Phòng</label>
                <select name="accessType" class="form-control" onchange="togglePassword(this)">
                    <option value="PUBLIC">Công Khai (Ai cũng vào được)</option>
                    <option value="PRIVATE">Riêng Tư (Cần mật khẩu)</option>
                </select>
            </div>
            <div class="form-group" id="passGroup" style="display:none;">
                <label>Mật Khẩu</label>
                <input type="password" name="password" class="form-control" placeholder="Nhập pass...">
            </div>
            
            <div style="display: flex; gap: 10px;">
                <button type="button" onclick="closeCreateModal()" style="flex:1; background:#444; border:none; color:#fff; padding:12px; border-radius:6px; cursor:pointer;">Hủy</button>
                <button type="submit" class="btn-submit" style="flex:2;">Tạo Ngay</button>
            </div>
        </form>
    </div>
    
    <style>
        .modal-overlay {
            position: fixed; top:0; left:0; width:100%; height:100%;
            background: rgba(0,0,0,0.8);
            display: none; justify-content: center; align-items: center;
            z-index: 9999;
        }
        .modal-box {
            background: #222; padding: 30px; border-radius: 12px;
            width: 400px; position: relative;
            box-shadow: 0 0 20px rgba(229,9,20,0.3);
            color: #fff;
        }
        .modal-box .form-group { margin-bottom: 15px; }
        .modal-box .form-control {
            width: 100%; padding: 10px; background: #333; border: 1px solid #444;
            color: #fff; border-radius: 6px; box-sizing: border-box;
        }
        .modal-box .form-control:focus {
            background: #252525;
            border-color: #e50914;
            outline: none;
            box-shadow: 0 0 5px rgba(229,9,20,0.3);
        }
        .modal-box .btn-submit {
            width: 100%; padding: 12px; background: #e50914;
            color: #fff; border: none; border-radius: 6px; font-weight: bold; cursor: pointer;
        }
        .modal-box label {
            color: #cccccc;
            font-weight: bold;
            display: block;
            margin-bottom: 5px;
        }
    </style>
    <script>
        function openCreateModal() {
            const modal = document.getElementById('createRoomModal');
            if (modal) modal.style.display = 'flex';
        }

        function closeCreateModal() {
            const modal = document.getElementById('createRoomModal');
            if (modal) modal.style.display = 'none';
        }

        function togglePassword(select) {
            const passGroup = document.getElementById('passGroup');
            if (passGroup) {
                passGroup.style.display = select.value === 'PRIVATE' ? 'block' : 'none';
            }
        }

        function handleCreateRoomSubmit(event) {
            const form = document.getElementById('createRoomForm');
            if (!form) return true;
            const nameInput = form.querySelector('input[name="name"]');
            if (!nameInput || !nameInput.value.trim()) {
                if (event) event.preventDefault();
                if (nameInput) nameInput.focus();
                alert('Vui lòng nhập tên phòng');
                return false;
            }
            return true;
        }

        window.addEventListener('click', function(event) {
            const modal = document.getElementById('createRoomModal');
            if (event.target === modal) {
                closeCreateModal();
            }
        });
    </script>
</div>
</body>
</html>
