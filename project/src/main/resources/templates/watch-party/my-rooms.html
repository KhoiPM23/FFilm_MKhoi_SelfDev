<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Phòng Chiếu Của Tôi - FFilm Cinema</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/footer.css">

    <style>
        /* CINEMATIC THEME */
        body {
            background-color: #050505;
            background-image: radial-gradient(circle at 50% 0%, #1a0b0b 0%, #000000 100%);
            color: #fff;
            font-family: 'Segoe UI', sans-serif;
        }

        .cinema-header {
            text-align: center;
            padding: 40px 0;
            position: relative;
        }
        
        .cinema-header h2 {
            font-size: 2.5rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 2px;
            background: linear-gradient(45deg, #ff3546, #ffac41);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 20px rgba(229, 9, 20, 0.5);
        }

        /* CARD VIPRO STYLE */
        .party-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 25px;
            margin-bottom: 25px;
            backdrop-filter: blur(10px);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
            overflow: hidden;
        }

        .party-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 4px; height: 100%;
            background: #e50914;
            opacity: 0.5;
            transition: 0.3s;
        }

        .party-card:hover {
            transform: translateY(-5px) scale(1.01);
            box-shadow: 0 10px 30px rgba(229, 9, 20, 0.2);
            border-color: rgba(229, 9, 20, 0.4);
        }

        .party-card:hover::before {
            opacity: 1;
            box-shadow: 0 0 15px #e50914;
        }

        .room-title {
            font-size: 1.4rem;
            font-weight: 700;
            color: #fff;
            margin-bottom: 5px;
        }

        .room-info {
            color: #aaa;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .badge-cine {
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
        }
        .badge-private { background: rgba(229, 9, 20, 0.2); color: #ff4d5a; border: 1px solid rgba(229, 9, 20, 0.4); }
        .badge-public { background: rgba(70, 211, 105, 0.2); color: #46d369; border: 1px solid rgba(70, 211, 105, 0.4); }

        /* BUTTONS */
        .btn-glow {
            background: linear-gradient(90deg, #e50914, #ff6b6b);
            border: none;
            color: white;
            padding: 10px 25px;
            border-radius: 30px;
            font-weight: 600;
            box-shadow: 0 0 15px rgba(229, 9, 20, 0.4);
            transition: 0.3s;
        }
        .btn-glow:hover {
            box-shadow: 0 0 25px rgba(229, 9, 20, 0.7);
            transform: scale(1.05);
            color: white;
        }

        .btn-icon {
            width: 45px; height: 45px;
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            border: 1px solid rgba(255,255,255,0.2);
            color: #fff;
            background: transparent;
            transition: 0.3s;
        }
        .btn-icon:hover {
            background: rgba(255,255,255,0.1);
            color: #e50914;
            border-color: #e50914;
        }

        /* MODAL DARK */
        .modal-content {
            background: #121212;
            border: 1px solid #333;
            color: #fff;
        }
        .form-control, .form-select {
            background: #1f1f1f;
            border: 1px solid #333;
            color: #fff;
        }
        .form-control:focus {
            background: #252525;
            border-color: #e50914;
            color: #fff;
            box-shadow: 0 0 5px rgba(229,9,20,0.3);
        }

        /* Fix Modal Create Room visibility */
        .modal-content, .modal-box {
            background-color: #1f1f1f !important;
            color: #ffffff !important;
            border: 1px solid #333;
        }
        .modal-content label, .modal-box label {
            color: #cccccc !important;
            font-weight: bold;
        }
        .modal-content input, .modal-content select, 
        .modal-box input, .modal-box select {
            background-color: #333 !important;
            color: #fff !important;
            border: 1px solid #555 !important;
        }
        .modal-content input::placeholder {
            color: #888 !important;
        }
    </style>
</head>
<body>
    <div th:replace="~{fragments/header :: header}"></div>

    <div class="container" style="min-height: 80vh;">
        <div class="cinema-header">
            <h2><i class="fas fa-film"></i> Phòng Chiếu Của Tôi</h2>
            <p class="text-muted">Quản lý không gian xem phim riêng tư của bạn</p>
            <button class="btn btn-glow mt-2" data-bs-toggle="modal" data-bs-target="#createRoomModal">
                <i class="fas fa-plus"></i> Tạo Phòng Mới
            </button>
        </div>

        <div class="row px-3">
            <div th:if="${rooms.empty}" class="text-center text-muted mt-5">
                <i class="fas fa-wind fa-3x mb-3"></i>
                <p>Bạn chưa có phòng chiếu nào. Hãy tạo ngay để mời bạn bè!</p>
            </div>

            <div th:each="room : ${rooms}" class="col-md-10 offset-md-1">
                <div class="party-card d-flex justify-content-between align-items-center">
                    <div>
                        <div class="d-flex align-items-center gap-3 mb-2">
                            <div class="room-title" th:text="${room.name}">Tên phòng</div>
                            <span th:if="${room.accessType == 'PRIVATE'}" class="badge-cine badge-private"><i class="fas fa-lock"></i> Riêng tư</span>
                            <span th:if="${room.accessType == 'PUBLIC'}" class="badge-cine badge-public"><i class="fas fa-globe"></i> Công khai</span>
                        </div>
                        <div class="room-info">
                            <span><i class="fas fa-users"></i> Giới hạn: <b th:text="${room.maxUsers}"></b> người</span>
                            <span th:if="${room.password}"><i class="fas fa-key"></i> Pass: ••••••</span>
                            <span class="text-warning" th:if="${room.active}"><i class="fas fa-circle fa-xs"></i> Đang hoạt động</span>
                        </div>
                    </div>
                    <div class="d-flex gap-3">
                        <a th:href="@{/watch-party/room/{id}(id=${room.id})}" class="btn btn-glow text-decoration-none">
                            <i class="fas fa-play"></i> Vào Phòng
                        </a>
                        <button class="btn btn-icon" th:onclick="'deleteRoom(' + ${room.id} + ')'" title="Xóa phòng">
                            <i class="fas fa-trash-alt"></i>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="createRoomModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header border-bottom-0">
                    <h5 class="modal-title">🎬 Thiết lập phòng chiếu mới</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <form id="createRoomForm" action="/watch-party/create" method="post" onsubmit="return handleCreateRoomSubmit(event)">
                    <div class="modal-body">
                        <div class="mb-3">
                            <label class="form-label text-muted">Tên phòng</label>
                            <input type="text" name="name" class="form-control" required placeholder="VD: Hội Phim Kinh Dị...">
                        </div>
                        <div class="mb-3">
                            <label class="form-label text-muted">Quy mô phòng</label>
                            <select name="maxUsers" class="form-select">
                                <option value="10">Gia đình (10 ghế)</option>
                                <option value="25">Bạn bè (25 ghế)</option>
                                <option value="100">Cộng đồng (100 ghế)</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label text-muted">Mật khẩu (Tùy chọn)</label>
                            <input type="password" name="password" id="myRoomPassword" class="form-control" placeholder="Để trống nếu muốn công khai">
                        </div>
                        <input type="hidden" name="accessType" id="myRoomAccessType" value="PUBLIC">
                    </div>
                    <div class="modal-footer border-top-0">
                        <button type="submit" class="btn btn-glow w-100">Khởi Tạo</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <div th:replace="~{fragments/footer :: footer}"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        function handleCreateRoomSubmit(event) {
            const form = document.getElementById('createRoomForm');
            if (!form) return true;
            const nameInput = form.querySelector('input[name="name"]');
            if (!nameInput || !nameInput.value.trim()) {
                if (event) event.preventDefault();
                if (nameInput) nameInput.focus();
                alert('Vui lòng nhập tên phòng');
                return false;
            }
            const passInput = form.querySelector('input[name="password"]');
            const accessTypeInput = document.getElementById('myRoomAccessType');
            if (accessTypeInput) {
                accessTypeInput.value = (passInput && passInput.value.trim().length > 0) ? 'PRIVATE' : 'PUBLIC';
            }
            return true;
        }

        function submitCreateRoom() {
            const form = document.getElementById('createRoomForm');
            if (form && handleCreateRoomSubmit()) {
                form.submit();
            }
        }

        function deleteRoom(id) { /* Logic cũ */ 
            if(!confirm("Bạn có chắc muốn giải tán phòng này không?")) return;
            fetch(`/api/party/delete/${id}`, { method: 'DELETE' })
            .then(res => { if(res.ok) window.location.reload(); });
        }
    </script>
</body>
</html>
